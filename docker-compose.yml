# version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: aurawealth_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YourSecurePassword
      POSTGRES_DB: AuraWealth
    ports:
      - "5432:5432"
    volumes:
      - aurawealth_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  aurawealth_pgdata: